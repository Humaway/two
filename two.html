<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TWO</title>
<style>
:root {
  --navy: #141d3a; --yes: #ffd21f; --jv: #2f6fd6; --jvbar: #d9dce1;
  --game: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --sys: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono: "Courier New", ui-monospace, Menlo, Consolas, monospace;
  --ts: 22px;
}
body.large { --ts: 28px; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; touch-action: none;
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; font-family: var(--game); color: #fff; }
#gl, #overlay { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: block; }
#overlay { pointer-events: none; z-index: 1; }
#ui { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
#ui > * { position: absolute; }
.off { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; pointer-events: auto; border: 0; background: none; padding: 0; outline: none; }

/* layers */
#mg { inset: 0; z-index: 1; }
#mg > * { pointer-events: auto; }
#cardwrap { inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; }
#cardwrap canvas { filter: drop-shadow(0 10px 18px rgba(0,0,0,.45)); }
#fade, #flash { inset: 0; opacity: 0; background: #000; }
#flash { z-index: 9; background: #fff; }
#fade { z-index: 10; opacity: 1; }

/* letterbox 2.35:1 */
.lb { left: 0; right: 0; height: max(0px, calc((100vh - 100vw / 2.35) / 2)); background: #000; z-index: 6; transition: transform .4s ease-in-out; }
#lbt { top: 0; transform: translateY(-100%); }
#lbb { bottom: 0; transform: translateY(100%); }
#ui.lbon #lbt, #ui.lbon #lbb { transform: none; }

/* objective */
#obj { left: 18px; top: 16px; z-index: 3; max-width: 46vw; font-size: 16px; text-shadow: 0 1px 2px #000, 0 0 6px rgba(0,0,0,.6); transition: opacity .3s; }
#obj.hide { opacity: 0; }
#obj .line { display: flex; gap: 8px; align-items: baseline; }
#obj .line::before { content: ""; width: 4px; height: 15px; background: var(--yes); border-radius: 2px; flex: none; transform: translateY(2px); }
#obj .it { margin: 4px 0 0 12px; font-size: 15px; color: #e8ecf5; }
#obj .it::before { content: "\2610  "; color: #cfd6e6; }
#obj .it.done { color: #9aa3b8; text-decoration: line-through; text-decoration-color: rgba(255,210,31,.8); }
#obj .it.done::before { content: "\2611  "; color: var(--yes); }

/* 1987 HUD */
#hud { right: 18px; top: 14px; z-index: 7; display: flex; align-items: center; gap: 9px; padding: 6px 12px 6px 10px; border-radius: 10px;
  background: rgba(10,14,30,.55); font-size: 15px; font-weight: bold; letter-spacing: .04em; text-shadow: 0 1px 1px #000; }
#hud .bat { position: relative; width: 34px; height: 16px; border: 2px solid #fff; border-radius: 3px; }
#hud .bat::after { content: ""; position: absolute; right: -6px; top: 3px; width: 3px; height: 6px; background: #fff; border-radius: 0 2px 2px 0; }
#hud .bat i { position: absolute; left: 2px; top: 2px; bottom: 2px; width: 26px; background: #7fe07a; transform-origin: 0 50%; }
#hud.low .bat i { background: #ff4a3d; }
#hud .bars { display: flex; align-items: flex-end; gap: 2px; height: 16px; }
#hud .bars i { width: 4px; background: rgba(255,255,255,.25); border-radius: 1px; }
#hud .bars i:nth-child(1) { height: 25%; } #hud .bars i:nth-child(2) { height: 50%; }
#hud .bars i:nth-child(3) { height: 75%; } #hud .bars i:nth-child(4) { height: 100%; }
#hud .bars i.on { background: #fff; }
#hud .ns { font-size: 13px; color: #ffb3a8; font-weight: normal; }
#hud.nobat .bat, #hud.nobat .pct { display: none; }

/* interaction prompt, toast, swap */
#prompt { left: 50%; bottom: 7vh; z-index: 3; transform: translateX(-50%); padding: 7px 16px 7px 8px; border-radius: 999px; white-space: nowrap;
  background: rgba(20,29,58,.82); border: 1px solid rgba(255,210,31,.55); font-size: 17px; }
#prompt b { display: inline-block; padding: 2px 9px; margin-right: 8px; border-radius: 999px; background: var(--yes); color: var(--navy); font-size: 14px; letter-spacing: .06em; }
#prompt b.no { background: #e8e8ee; }
#ui.talking #prompt, #ui.talking #swap, #ui.invopen #swap { opacity: 0; }
#toast { right: 24px; bottom: 24px; z-index: 11; padding: 8px 18px; border-radius: 10px; background: rgba(20,29,58,.85); border-top: 2px solid var(--yes);
  font-size: 17px; opacity: 0; transition: opacity .35s; }
#toast.show { opacity: 1; }
#ui.talking #toast { bottom: calc(3.5vh + 170px); } /* never under the dialogue box */
#swap { left: 18px; bottom: 18px; z-index: 3; width: 96px; height: 84px; }
#swap img { position: absolute; border-radius: 10px; border: 2px solid rgba(255,255,255,.8); background: var(--navy); }
#swap .a { left: 0; bottom: 0; width: 64px; height: 64px; z-index: 2; border-color: var(--yes); }
#swap .b { left: 46px; bottom: 32px; width: 40px; height: 40px; opacity: .8; }
#swap span { position: absolute; left: 68px; bottom: 2px; font-size: 12px; font-weight: bold; color: var(--yes); text-shadow: 0 1px 2px #000; }

/* dialogue box */
#dlg { left: 10%; width: 80%; bottom: 3.5vh; z-index: 7; display: flex; gap: 16px; align-items: flex-start; min-height: 128px; padding: 16px 22px 18px 16px;
  background: rgba(20,29,58,.9); border-top: 3px solid var(--yes); border-radius: 16px; box-shadow: 0 4px 0 rgba(0,0,0,.25); pointer-events: auto; }
#dlg .face { flex: none; width: 96px; height: 96px; border-radius: 12px; background: #26325e; border: 2px solid rgba(255,255,255,.18); object-fit: cover; }
#dlg .col { flex: 1; min-width: 0; }
#dlg .who { height: 22px; margin: 0 0 6px; font-weight: bold; font-size: 17px; letter-spacing: .08em; color: var(--yes); white-space: nowrap; }
#dlg .who i { margin-left: 10px; font-style: normal; font-weight: normal; font-size: 13px; letter-spacing: .04em; color: #97a2c2; text-transform: lowercase; }
#dlg .txt { min-height: 2.6em; font-size: var(--ts); line-height: 1.34; white-space: pre-wrap; overflow-wrap: break-word; text-shadow: 0 1px 1px rgba(0,0,0,.4); }
#dlg .more { position: absolute; right: 20px; bottom: 12px; width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent;
  border-top: 11px solid var(--yes); animation: bob .7s ease-in-out infinite alternate; }
@keyframes bob { to { transform: translateY(5px); } }
#dlg.noface .face { display: none; }
#dlg.noname .who { display: none; }
#dlg .opts { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
#dlg .opts button { text-align: left; padding: 5px 12px 5px 30px; border-radius: 8px; font-size: calc(var(--ts) * .9); position: relative; color: #e8ecf8; }
#dlg .opts button.sel { background: rgba(255,255,255,.1); color: #fff; }
#dlg .opts button.sel::before { content: "\25B6"; position: absolute; left: 9px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--yes); }
#dlg .opts button.dis { color: #6d7695; }
#dlg .opts.ask { flex-direction: row; gap: 14px; }
#dlg .opts.ask button { padding: 6px 22px; border: 2px solid var(--yes); border-radius: 999px; font-weight: bold; letter-spacing: .08em; }
#dlg .opts.ask button:first-child { background: var(--yes); color: var(--navy); }
#dlg .opts.ask button.sel::before { content: none; }
#dlg .opts.ask button.dis { border-color: #4a5170; background: transparent; color: #6d7695; }

/* title and act cards: above #fade, so "Tuesday, 6 October 1987" reads over black */
#tcard, #acard { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; text-align: center; }
#tcard { z-index: 11; letter-spacing: .28em; font-size: 21px; text-transform: uppercase; text-shadow: 0 2px 6px #000, 0 0 18px rgba(0,0,0,.6); padding-left: .28em; }
#acard { z-index: 11; background: #000; }
#acard b { font-size: 46px; letter-spacing: .3em; padding-left: .3em; margin-bottom: 18px; }
#acard i { font-size: 22px; color: #d7dbe8; letter-spacing: .05em; }
#acard hr { width: 64px; border: 0; border-top: 3px solid var(--yes); margin: 0 0 18px; }

/* JARVIS pop-ups: tired corporate web app */
#pops { inset: 0; z-index: 5; }
.jvw { position: absolute; left: 0; top: 0; }
.jv { width: 340px; max-width: calc(100vw - 20px); background: #fff; color: #2b2f36; font-family: var(--sys); font-size: 14px; line-height: 1.4; text-align: left;
  border: 1px solid #8e96a4; border-radius: 3px; box-shadow: 0 3px 0 rgba(0,0,0,.18), 0 8px 16px rgba(0,0,0,.25); pointer-events: auto;
  animation: jvpop .16s ease-out; }
.jv.shake { animation: jvshake .42s ease-out; }
@keyframes jvpop { from { transform: scale(.86); opacity: 0; } }
@keyframes jvshake { 0% { transform: scale(.8); } 15% { transform: translateX(-12px) rotate(-1.5deg); } 30% { transform: translateX(11px) rotate(1deg); }
  45% { transform: translateX(-8px); } 60% { transform: translateX(6px); } 75% { transform: translateX(-3px); } 100% { transform: none; } }
.jv-bar { display: flex; align-items: center; gap: 8px; height: 28px; border-radius: 3px 3px 0 0; padding: 0 8px; background: linear-gradient(#e6e8ec, #d2d6dc); border-bottom: 1px solid #aab0ba; color: #4a505c; font-size: 12.5px; }
.jv-logo { display: flex; align-items: center; gap: 5px; font-weight: 800; font-style: italic; letter-spacing: .06em; color: var(--jv); font-size: 12px; }
.jv-logo::before { content: ""; width: 11px; height: 11px; border-radius: 2px; background: var(--jv); box-shadow: inset -3px -3px 0 #1d4fa8; }
.jv-t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.jv-x { color: #9aa0aa; font-style: normal; font-size: 15px; }
.jv-body { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px 10px; }
.jv-msg { flex: 1; white-space: pre-line; overflow-wrap: break-word; }
.ic { flex: none; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 18px; color: #fff; font-family: var(--sys); }
.ic.error { background: #d43a2f; border-radius: 50%; }
.ic.info { background: var(--jv); border-radius: 50%; font-family: Georgia, serif; font-style: italic; }
.ic.warn { background: #f2b51c; color: #2b2f36; clip-path: polygon(50% 2%, 100% 96%, 0 96%); padding-top: 7px; font-size: 16px; }
.ic.none { display: none; }
.jv-spin { width: 26px; height: 26px; margin: 2px auto 10px; border: 3px solid #d7dbe2; border-top-color: var(--jv); border-radius: 50%; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.jv-prog { display: flex; align-items: center; gap: 8px; padding: 0 16px 12px; font-size: 12px; color: #6b717c; }
.jv-prog div { flex: 1; height: 12px; border: 1px solid #a9b0bb; background: #eef0f3; border-radius: 2px; overflow: hidden; }
.jv-prog i { display: block; height: 100%; background: repeating-linear-gradient(-45deg, #4f8ae6 0 8px, #3a74d4 8px 16px); transform-origin: 0 50%; }
.jv-prog.anim i { animation: stripes .6s linear infinite; background-size: 22.6px 100%; }
@keyframes stripes { from { background-position: 0 0; } to { background-position: 22.6px 0; } }
.jv-btns { display: flex; justify-content: flex-end; gap: 8px; padding: 8px 12px 12px; border-radius: 0 0 3px 3px; background: #f4f5f7; border-top: 1px solid #e1e4e8; }
.jv-btns:empty { display: none; }
.jv-b { min-width: 74px; padding: 5px 14px; border-radius: 3px; background: linear-gradient(#4b8cf0, var(--jv)); border: 1px solid #2459b3; color: #fff;
  font-family: var(--sys); font-size: 13.5px; box-shadow: inset 0 1px 0 rgba(255,255,255,.3); transition: transform .12s; }
.jv-b.foc { outline: 2px solid #ffcf3a; outline-offset: 1px; }
.jv-b:active { background: #2459b3; }
.jv.big { width: 460px; font-size: 16px; }
.jv.crash .jv-body { background: #fff4f3; }

/* inventory */
#inv { left: 50%; bottom: 4vh; z-index: 12; transform: translateX(-50%); width: min(880px, 92vw); padding: 16px 20px 14px; border-radius: 16px;
  background: rgba(20,29,58,.94); border-top: 3px solid var(--yes); pointer-events: auto; }
#inv .hd { display: flex; justify-content: space-between; font-size: 13px; color: #97a2c2; letter-spacing: .1em; margin-bottom: 10px; }
#inv .row { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 8px; }
#inv .slot { flex: none; width: 96px; text-align: center; padding: 6px 4px; border-radius: 10px; border: 2px solid transparent; }
#inv .slot canvas { width: 72px; height: 72px; display: block; margin: 0 auto 4px; border-radius: 8px; background: rgba(255,255,255,.06); }
#inv .slot span { display: block; font-size: 12.5px; line-height: 1.2; color: #dfe4f2; }
#inv .slot.sel { border-color: var(--yes); background: rgba(255,210,31,.1); }
#inv .slot.pick { border-color: #7fb4ff; }
#inv .desc { min-height: 1.4em; margin: 6px 0 10px; font-size: 17px; }
#inv .acts { display: flex; gap: 10px; }
#inv .acts button { padding: 6px 18px; border-radius: 999px; border: 2px solid rgba(255,210,31,.5); font-size: 15px; }
#inv .acts button.sel { background: var(--yes); color: var(--navy); border-color: var(--yes); }
#inv .acts.dim button { opacity: .35; }
#inv .empty { color: #97a2c2; padding: 18px 0; }

/* title screen and menus */
#title { inset: 0; z-index: 13; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 30%, rgba(0,0,0,.7) 100%); }
#title .logo { font-size: min(26vh, 22vw); font-weight: bold; letter-spacing: .12em; margin-left: .12em; line-height: 1; color: #f4f1e8;
  text-shadow: 0 6px 24px rgba(0,0,0,.6); }
#title .rule { width: 18vh; height: 4px; margin: 2vh 0 4vh; background: var(--yes); border-radius: 2px; }
#title .press { font-size: 22px; font-weight: bold; letter-spacing: .3em; color: var(--yes); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
#title .disc { position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; font-size: 12.5px; color: rgba(255,255,255,.55); letter-spacing: .03em; }
#title.withmenu .press { display: none; }
#title.withmenu { justify-content: flex-start; padding-top: 11vh; }
#title.withmenu .logo { font-size: min(18vh, 16vw); }
#menu { inset: 0; z-index: 14; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
#menu.dim { background: rgba(6,9,22,.72); }
#menu.low { align-items: flex-end; padding-bottom: 12vh; background: none; }
#menu .panel { min-width: 340px; max-width: min(760px, 94vw); max-height: 86vh; display: flex; flex-direction: column; padding: 18px 22px 14px;
  border-radius: 16px; background: rgba(20,29,58,.93); border-top: 3px solid var(--yes); }
#menu.low .panel { background: rgba(20,29,58,.72); min-width: 300px; }
#menu .head { font-weight: bold; letter-spacing: .2em; color: var(--yes); font-size: 15px; margin: 2px 0 12px 6px; }
#menu .head:empty { display: none; }
#menu .list { overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
#menu .list button { display: flex; justify-content: space-between; gap: 30px; text-align: left; padding: 8px 14px 8px 32px; border-radius: 9px; font-size: 19px;
  position: relative; color: #e2e7f4; white-space: nowrap; }
#menu .list button.sel { background: rgba(255,255,255,.1); color: #fff; }
#menu .list button.sel::before { content: "\25B6"; position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--yes); }
#menu .list button em { font-style: normal; color: var(--yes); letter-spacing: .04em; }
#menu .list button.dis { color: #6d7695; }
#menu .list button small { color: #8f9abb; font-size: 14px; }
#menu .body { overflow-y: auto; margin-bottom: 10px; font-size: 16px; line-height: 1.5; color: #dfe4f2; }
#menu .body:empty { display: none; }
#menu .body table { border-collapse: collapse; width: 100%; font-size: 15px; }
#menu .body td, #menu .body th { padding: 5px 12px; border-bottom: 1px solid rgba(255,255,255,.1); text-align: left; }
#menu .body th { color: var(--yes); font-size: 13px; letter-spacing: .08em; }
@media (max-width: 600px) { #menu .body table { font-size: 12px; } #menu .body td, #menu .body th { padding: 4px 4px; font-size: 11px; letter-spacing: 0; } #menu .body th { font-size: 10px; } }
#menu .body canvas { display: block; margin: 0 auto; max-width: 100%; max-height: 60vh; }
#menu .body p { margin: 0 0 12px; text-align: center; }
#menu .body .cr b { color: var(--yes); letter-spacing: .12em; font-size: 13px; display: block; margin-top: 10px; }
#menu .foot { margin-top: 10px; font-size: 12.5px; color: #8f9abb; text-align: right; letter-spacing: .05em; }

/* loader */
#loader { inset: 0; z-index: 20; background: #000; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
#loader .jv { width: 380px; animation: none; }

/* touch controls */
#touch { inset: 0; z-index: 15; }
#touch > * { position: absolute; pointer-events: auto; touch-action: none; }
#stick { left: 26px; bottom: 26px; width: 150px; height: 150px; border-radius: 50%; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.25); }
#stick i { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: rgba(255,255,255,.35); }
.tb { width: 64px; height: 64px; border-radius: 50%; font-weight: bold; font-size: 14px; letter-spacing: .05em; background: rgba(20,29,58,.7); border: 2px solid rgba(255,255,255,.4); color: #fff; }
.tb.on { background: rgba(255,210,31,.6); }
#t-yes { right: 30px; bottom: 96px; width: 84px; height: 84px; background: rgba(255,210,31,.85); color: var(--navy); font-size: 17px; border-color: var(--yes); }
#t-no { right: 128px; bottom: 34px; }
#t-swap { right: 128px; bottom: 124px; font-size: 12px; }
#t-bag { right: 40px; bottom: 16px; width: 64px; height: 64px; font-size: 12px; }
#t-pause { right: 14px; top: 64px; width: 46px; height: 46px; font-size: 16px; }
#ui.touchui #prompt { bottom: 200px; } /* clear of the stick and the YES/NO buttons on narrow phones */
#ui.touchui #dlg { left: 12px; width: calc(100% - 228px); bottom: 12px; }
#ui.touchui.talking #stick, #ui.touchui.talking #t-swap, #ui.touchui.talking #t-bag, #ui.touchui.invopen #stick, #ui.touchui.invopen #t-swap { opacity: 0; pointer-events: none; }
#ui.touchui #inv { left: 12px; transform: none; width: calc(100% - 228px); bottom: 12px; } /* beside YES/NO, like the dialogue box */
#ui.touchui #swap { bottom: 190px; } /* above the stick */
#ui.menuon #touch { display: none; } /* title and menus: tap the items */
#ui.touchui #toast, #ui.touchui.talking #toast { top: 120px; bottom: auto; right: 14px; } /* under the pause button, clear of the buttons */
@media (max-width: 600px) { /* phones in portrait: the box goes full width, above YES/NO */
  #ui.touchui #dlg, #ui.touchui #inv { width: calc(100% - 24px); bottom: 196px; }
  #ui.touchui #dlg .face { width: 64px; height: 64px; }
}

/* F2 overlay */
#perf { left: 8px; top: 48px; z-index: 30; padding: 6px; background: rgba(0,0,0,.72); border-radius: 6px; font: 11px/1.35 var(--mono); color: #cfe; }
#perf canvas { display: block; width: 240px; height: 64px; }
#perf pre { margin: 4px 0 0; white-space: pre-wrap; max-width: 240px; font: inherit; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="overlay"></canvas>
<div id="ui">
  <div id="mg"></div>
  <div id="cardwrap" class="off"><canvas id="card"></canvas></div>
  <div id="obj" class="off"></div>
  <div id="hud" class="off"><div class="bat"><i></i></div><span class="pct">1%</span><div class="bars"><i></i><i></i><i></i><i></i></div><span class="ns">No Service</span></div>
  <div id="swap" class="off"><img class="b" alt=""><img class="a" alt=""><span>TAB</span></div>
  <div id="prompt" class="off"></div>
  <div id="pops"></div>
  <div id="lbt" class="lb"></div><div id="lbb" class="lb"></div>
  <div id="dlg" class="off"><img class="face" alt=""><div class="col"><div class="who"><span></span><i></i></div><div class="txt"></div><div class="opts"></div></div><div class="more off"></div></div>
  <div id="tcard"></div>
  <div id="acard"><b></b><hr><i></i></div>
  <div id="flash"></div>
  <div id="fade"></div>
  <div id="toast"></div>
  <div id="inv" class="off" data-noyes><div class="hd"><span>INVENTORY</span><span class="hint">YES — Select · NO — Close</span></div><div class="row"></div><div class="desc"></div><div class="acts"><button>Examine</button><button>Use</button><button>Combine</button></div></div>
  <div id="title" class="off"><div class="logo">two</div><div class="rule"></div><div class="press">PRESS YES</div><div class="disc">A work of affectionate parody. Not affiliated with or endorsed by Optus.</div></div>
  <div id="menu" class="off" data-noyes><div class="panel"><div class="head"></div><div class="body"></div><div class="list"></div><div class="foot">YES — Select · NO — Back</div></div></div>
  <div id="touch" class="off">
    <div id="stick"><i></i></div>

// ------------------------------------------------------------ event bus
const bus = {};
function on(name, fn) { (bus[name] ||= []).push(fn); }
function off(name, fn) { const l = bus[name]; if (l) { const i = l.indexOf(fn); if (i >= 0) l.splice(i, 1); } }

// ------------------------------------------------------------ clock, updaters, waits
// clock.t only advances in fixed CONFIG.step ticks. clock.scale > 1 = extra ticks per frame (see boot()).
const clock = {

  fns: [], waits: [], dirty: false,
  step() { // one fixed tick of game time: updaters + waits (world.update is called by the loop)
    const dt = CONFIG.step;
    clock.t += dt; clock.frame++;
    const fns = clock.fns;
    for (let i = 0; i < fns.length; i++) { const f = fns[i]; if (f) f(dt); }
    if (clock.dirty) { let j = 0; for (let i = 0; i < fns.length; i++) if (fns[i]) fns[j++] = fns[i]; fns.length = j; clock.dirty = false; }
    const w = clock.waits, skip = typeof flow !== 'undefined' && flow.skipping;
    let j = 0;
    for (let i = 0; i < w.length; i++) {
      const x = w[i];
      if (skip || (x.fn ? x.fn() : clock.t >= x.t)) x.res(); else w[j++] = x;
    }
    w.length = j;
  },
};
function addUpdate(fn) { if (!clock.fns.includes(fn)) clock.fns.push(fn); }
function removeUpdate(fn) { const i = clock.fns.indexOf(fn); if (i >= 0) { clock.fns[i] = null; clock.dirty = true; } }
function wait(sec) {
  if ((typeof flow !== 'undefined' && flow.skipping) || !(sec > 0)) return Promise.resolve();
  return new Promise((res) => clock.waits.push({ t: clock.t + sec, fn: null, res }));
}
function waitUntil(fn) {
  if (typeof flow !== 'undefined' && flow.skipping) return Promise.resolve();
  return new Promise((res) => clock.waits.push({ t: 0, fn, res })); // checked from the next tick on
}

// ------------------------------------------------------------ input
const input = (() => {
  const A = ['yes', 'no', 'swap', 'inventory', 'run', 'pause', 'up', 'down', 'left', 'right'];
  const DIRS = { up: 1, down: 1, left: 1, right: 1 }, PADA = Object.keys(CONFIG.pad);
  const kb = {}, pad = {}, tch = {}, ms = {}, hit = {}, rel = {}, prev = {}, pr = {}, re = {}, dn = {};

  const I = {
    move: { x: 0, y: 0 }, run: false, scheme: touchDevice ? 'touch' : 'kb', lastKey: '',
    pointer: { x: innerWidth / 2, y: innerHeight / 2, down: false, pressed: false, released: false, over: null },
    gesture: null, // set by boot(): called synchronously inside the first key/pointer event (audio unlock)
    pressed: (a) => pr[a] === true,
    held: (a) => dn[a] === true,
    released: (a) => re[a] === true,
    consume(a) { pr[a] = false; },
    setScheme(s) {
      if (I.scheme === s) return;
      I.scheme = s;
      const on = s === 'touch' && touchDevice;
      touchEl.classList.toggle('off', !on); touchEl.parentNode.classList.toggle('touchui', on);
    },
    poll() { // once per frame: gamepads

      let g = null;
      for (let i = 0; i < gp.length; i++) if (gp[i] && gp[i].connected) { g = gp[i]; break; }
      if (!g) return;
      let any = false;
      for (let i = 0; i < PADA.length; i++) {
        const a = PADA[i], b = g.buttons[CONFIG.pad[a]], d = !!(b && b.pressed);
        if (d && !pPrev[a]) { push(a); any = true; }
        pad[a] = d; pPrev[a] = d;
      }
      let x = g.axes[0] || 0, y = -(g.axes[1] || 0);
      const m = Math.hypot(x, y);
      if (m < 0.2) { x = 0; y = 0; } else { const k = Math.min(1, (m - 0.2) / 0.8) / m; x *= k; y *= k; any = true; }
      // stick flicks fire direction edges for menus and grids
      if (Math.abs(x) > 0.6 && Math.abs(padAxes.fx) < 0.35) push(x > 0 ? 'right' : 'left');
      if (Math.abs(y) > 0.6 && Math.abs(padAxes.fy) < 0.35) push(y > 0 ? 'up' : 'down');
      padAxes.x = padAxes.fx = x; padAxes.y = padAxes.fy = y;
      if (any) I.setScheme('pad');
    },
    tick() { // once per fixed tick: edges + move vector
      for (let i = 0; i < A.length; i++) {
        const a = A[i], d = !!(kb[a] || pad[a] || tch[a] || ms[a]);

        rel[a] = false; prev[a] = d; dn[a] = d;
      }
      const p = I.pointer;
      p.pressed = pPtr; p.released = rPtr; pPtr = rPtr = false;
      let x = (dn.right ? 1 : 0) - (dn.left ? 1 : 0), y = (dn.up ? 1 : 0) - (dn.down ? 1 : 0);
      if (x && y) { x *= Math.SQRT1_2; y *= Math.SQRT1_2; }
      if (Math.abs(padAxes.x) + Math.abs(padAxes.y) > Math.abs(x) + Math.abs(y)) { x = padAxes.x; y = padAxes.y; }
      if (stick.id >= 0 && Math.abs(stick.x) + Math.abs(stick.y) > Math.abs(x) + Math.abs(y)) { x = stick.x; y = stick.y; }
      I.move.x = x; I.move.y = y;
      I.run = !!(dn.run || (stick.id >= 0 && stick.far));

  };

  const gesture = () => { if (I.gesture) { const g = I.gesture; I.gesture = null; g(); } };
  const isField = (t) => t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);

  addEventListener('keydown', (e) => {
    if (e.code === 'F2') { e.preventDefault(); perf.toggle(); return; }
    I.lastKey = e.key;
    if (!e.repeat) emit('key', e.code);
    if (isField(e.target)) return;
    const a = codeTo[e.code];
    if (!a) return;
    e.preventDefault();
    I.setScheme('kb');
    gesture();
    if (!e.repeat) { keysDown.add(e.code); kb[a] = true; push(a); } else if (DIRS[a]) push(a);
  });
  addEventListener('keyup', (e) => {
    keysDown.delete(e.code);
    const a = codeTo[e.code];
    if (!a) return;
    let d = false;
    for (const c of CONFIG.keys[a]) if (keysDown.has(c)) d = true;
    if (kb[a] && !d) rel[a] = true;
    kb[a] = d;
  });
  addEventListener('blur', () => { keysDown.clear(); for (const a of A) kb[a] = ms[a] = tch[a] = false; });

  const onTouchUI = (e) => e.target.closest && e.target.closest('#touch'); // touch controls handle themselves, never move the pointer
  addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'touch') I.setScheme('touch'); else I.setScheme('kb');
    gesture();
    if (onTouchUI(e)) return;
    const p = I.pointer;
    p.x = e.clientX; p.y = e.clientY; p.down = true; p.over = e.target; pPtr = true;
    if (e.button === 2) { ms.no = true; push('no'); return; }
    if (e.button === 0 && !(e.target.closest && e.target.closest('button, [data-noyes], input, textarea'))) { ms.yes = true; push('yes'); }
  });
  addEventListener('pointermove', (e) => { if (onTouchUI(e)) return; const p = I.pointer; p.x = e.clientX; p.y = e.clientY; p.over = e.target; });
  addEventListener('pointerup', (e) => {
    if (onTouchUI(e)) return;
    const p = I.pointer; p.x = e.clientX; p.y = e.clientY; p.down = false; rPtr = true;
    if (ms.yes) { ms.yes = false; rel.yes = true; }
    if (ms.no) { ms.no = false; rel.no = true; }
  });
  addEventListener('pointercancel', () => { I.pointer.down = false; ms.yes = ms.no = false; });
  addEventListener('contextmenu', (e) => e.preventDefault());
  addEventListener('focusin', (e) => { if (e.target.tagName === 'BUTTON') e.target.blur(); }); // Enter/Space are YES, never a native click
  addEventListener('gamepadconnected', () => { pads++; });
  addEventListener('gamepaddisconnected', () => { pads = Math.max(0, pads - 1); });

  // touch buttons
  for (const b of touchEl.querySelectorAll('[data-a]')) {
    const a = b.dataset.a;
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); b.setPointerCapture(e.pointerId); tch[a] = true; push(a); b.classList.add('on'); });
    const up = () => { if (tch[a]) rel[a] = true; tch[a] = false; b.classList.remove('on'); };
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
  }
  // virtual stick: offset from the base centre / radius; beyond the rim = run
  const R = 60;
  const stickMove = (e) => {
    const r = stickEl.getBoundingClientRect();
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const d = Math.hypot(dx, dy);
    stick.far = d > R * 1.15;
    if (d > R) { dx *= R / d; dy *= R / d; }
    const x = dx / R, y = -dy / R, m = Math.hypot(x, y);
    stick.x = m < 0.15 ? 0 : x; stick.y = m < 0.15 ? 0 : y;
    if (Math.abs(x) > 0.6 && Math.abs(stick.fx) < 0.35) push(x > 0 ? 'right' : 'left');
    if (Math.abs(y) > 0.6 && Math.abs(stick.fy) < 0.35) push(y > 0 ? 'up' : 'down');
    stick.fx = x; stick.fy = y;
    knob.style.transform = `translate(${dx}px,${dy}px)`;
  };
  stickEl.addEventListener('pointerdown', (e) => { e.preventDefault(); stickEl.setPointerCapture(e.pointerId); stick.id = e.pointerId; stickMove(e); });
  stickEl.addEventListener('pointermove', (e) => { if (e.pointerId === stick.id) stickMove(e); });
  const stickUp = (e) => { if (e.pointerId !== stick.id) return; stick.id = -1; stick.x = stick.y = stick.fx = stick.fy = 0; stick.far = false; knob.style.transform = ''; };
  stickEl.addEventListener('pointerup', stickUp); stickEl.addEventListener('pointercancel', stickUp);

  if (touchDevice) { touchEl.classList.remove('off'); touchEl.parentNode.classList.add('touchui'); }
  return I;
})();

      if (winT < 2000) return;

      if (avg > 18 && lvl < levels.length - 1) { renderer.setPixelRatio(levels[++lvl]); good = 0; need *= 2; }

  //   band: [lo, hi] applied over the assembled loop, xf: crossfade the tail over the head (noise beds) }

    get scene() { return cur ? cur.scene : null; },

// ------------------------------------------------------------ dialogue: say / choose / ask
const { say, choose, ask } = (() => {
  const box = document.getElementById('dlg'), face = box.querySelector('.face'), nameEl = box.querySelector('.who span'), tagEl = box.querySelector('.who i');

    if (typeof AUDIO !== 'undefined') AUDIO.duck(false);
  }

    more.classList.add('off'); optsEl.classList.add('off');

  }
  function header(id, opts) {
    const ch = CHARACTERS[id];

    tagEl.textContent = opts.tag || '';
    box.classList.remove('noname');

  function opts(labels, askMode, dis) {
    optsEl.classList.toggle('ask', askMode);

      let b = btns[k];

        b = btns[k] = document.createElement('button'); b._k = k;
        b.addEventListener('click', () => { if (D.mode === 'choose') pick(b._k); else if (D.mode === 'ask') answer(b._k === 0); });

const popup = (() => {
  const layer = document.getElementById('pops');
  const pool = [], live = [], v3 = new THREE.Vector3();
  let seq = 0;
  const HTML = '<div class="jv"><div class="jv-bar"><span class="jv-logo">JARVIS</span><span class="jv-t"></span><i class="jv-x">&times;</i></div>' +
    '<div class="jv-body"><div class="ic"></div><div class="jv-msg"></div></div><div class="jv-spin"></div>' +
    '<div class="jv-prog"><div><i></i></div><span></span></div><div class="jv-btns"></div></div>';

  function make() {
    const w = document.createElement('div'); w.className = 'jvw off'; w.innerHTML = HTML;
    const q = (s) => w.querySelector(s);
    const p = { w, box: w.firstChild, title: q('.jv-t'), ic: q('.ic'), msg: q('.jv-msg'), spin: q('.jv-spin'), prog: q('.jv-prog'), bar: q('.jv-prog i'),
      pct: q('.jv-prog span'), btns: q('.jv-btns'), bs: [], open: false, tok: 0, spec: null, res: null, age: 0, life: 0, n: 0, focus: 0, tickT: 0,
      pr: null, prT: 0, actor: null, stack: false, z: 0 };

  }

    b = p.bs[k] = document.createElement('button'); b.className = 'jv-b'; b._k = k;
    b.addEventListener('click', () => { if (p.open) close(p, b._k); });

      focus(p, b._k);

    });

  function popup(spec) {
    const s = spec || {}, p = pool.pop() || make();
    p.open = true; p.spec = s; p.age = 0; p.life = s.dur || 0; p.tickT = 0;
    p.box.className = 'jv' + (s.shake ? ' shake' : '') + (s.cls ? ' ' + s.cls : '');
    p.box.style.width = s.w ? s.w + 'px' : '';
    const t = s.title ?? 'JARVIS';
    p.title.textContent = t === 'JARVIS' ? '' : t;
    const icon = s.icon || 'warn';
    p.ic.className = 'ic ' + icon;
    p.ic.textContent = icon === 'error' ? '✕' : icon === 'info' ? 'i' : icon === 'warn' ? '!' : '';
    p.msg.textContent = s.msg || '';

    if (s.progress) {

})();

// ------------------------------------------------------------ 1987 HUD (top right)
const hud = (() => {
  const el = document.getElementById('hud'), fill = el.querySelector('.bat i'), pct = el.querySelector('.pct'), ns = el.querySelector('.ns');
  const bars = el.querySelectorAll('.bars i');
  const anims = [];
  function show() {
    const b = state.battery, s = state.bars;
    if (b == null && s == null) { el.classList.add('off'); return; }
    el.classList.remove('off');
    fill.style.transform = `scaleX(${b > 0 ? Math.max(0.07, b / 100) : 0})`;
    pct.textContent = (b ?? 0) + '%';
    el.classList.toggle('low', (b ?? 0) <= 5);
    for (let k = 0; k < 4; k++) bars[k].classList.toggle('on', k < (s || 0));
    ns.classList.toggle('off', s !== 0 || b == null);
    el.classList.toggle('nobat', b == null); // bars only (3.8): no battery, no "No Service"
  }
  return {
    show,
    set(v) {
      anims.length = 0;
      if (!v) { state.battery = null; state.bars = null; } else { if ('battery' in v) state.battery = v.battery; if ('bars' in v) state.bars = v.bars; }
      show();
    },
    animate(v, dur = 1) { // counts one step at a time
      const ps = [];
      for (const key of ['battery', 'bars']) {
        if (!(key in v)) continue;
        if (ui.skipping()) { state[key] = v[key]; continue; }
        const from = state[key] || 0, n = Math.abs(v[key] - from);
        if (!n) continue;
        ps.push(new Promise((res) => anims.push({ key, to: v[key], step: dur / n, t: 0, res })));
      }
      show();
      return Promise.all(ps);
    },
    update(dt) {
      for (let i = anims.length - 1; i >= 0; i--) {
        const a = anims[i];
        a.t += dt;
        while (a.t >= a.step && state[a.key] !== a.to) { a.t -= a.step; state[a.key] = (state[a.key] || 0) + Math.sign(a.to - (state[a.key] || 0)); show(); }
        if (state[a.key] === a.to) { anims.splice(i, 1); a.res(); }
      }
    },
  };
})();

// ------------------------------------------------------------ portraits (baked at boot from a 3D bust; face texture / silhouette fallback)
const portraitURL = (() => {
  const urls = {}, cvs = {}, S = 128;
  const alias = { student: 'student_a', voice: null, operator: null, assistant: null };
  const blank = () => { const c = document.createElement('canvas'); c.width = c.height = S; return c; };
  function bg(x) {
    const g = x.createLinearGradient(0, 0, 0, S); g.addColorStop(0, '#34437a'); g.addColorStop(1, '#1b2448');
    x.fillStyle = g; x.fillRect(0, 0, S, S);
  }
  function silhouette(id) {
    const c = blank(), x = c.getContext('2d');
    bg(x);
    x.fillStyle = '#5d6a99';
    x.beginPath(); x.arc(64, 54, 25, 0, Math.PI * 2); x.fill();
    x.beginPath(); x.ellipse(64, 132, 48, 44, 0, Math.PI, 0); x.fill();
    if (id === 'operator' || id === 'voice') { // a phone line: little sound arcs
      x.strokeStyle = '#ffd21f'; x.lineWidth = 4; x.lineCap = 'round';
      for (let k = 1; k <= 2; k++) { x.beginPath(); x.arc(92, 40, 8 * k, -0.9, 0.9); x.stroke(); }
    }
    return c;
  }
  function fromFace(fc) {
    const c = blank(), x = c.getContext('2d');
    bg(x);
    const k = Math.max(S / fc.width, S / fc.height);
    x.drawImage(fc, (S - fc.width * k) / 2, (S - fc.height * k) / 2, fc.width * k, fc.height * k);
    return c;
  }
  function canvasFor(id) {
    if (cvs[id]) return cvs[id];
    const ch = CHARACTERS[id];
    if (ch && ch.voice && ch.voice.also) { // two speakers at once: split portrait
      const [a, b] = id.split('_'), c = blank(), x = c.getContext('2d');
      x.drawImage(canvasFor(a), S / 4, 0, S / 2, S, 0, 0, S / 2, S);
      x.drawImage(canvasFor(b), S / 4, 0, S / 2, S, S / 2, 0, S / 2, S);
      x.fillStyle = '#ffd21f'; x.fillRect(S / 2 - 1, 0, 2, S);
      return (cvs[id] = c);
    }
    const look = id in alias ? alias[id] : id;
    if (look && look !== id && cvs[look]) return (cvs[id] = cvs[look]);
    let fc = null;
    try {
      const a = look && typeof world !== 'undefined' && world.actor && world.actor(look);
      if (a && a.rig && a.rig.face) fc = a.rig.face.canvas;
      else if (look && LOOKS[look] && typeof buildCharacter === 'function') fc = buildCharacter(look).face.canvas;
    } catch (e) { fc = null; }
    return (cvs[id] = fc ? fromFace(fc) : silhouette(id));
  }
  function portraitURL(id) { return urls[id] || (urls[id] = canvasFor(id).toDataURL()); }
  portraitURL.bake = (id, canvas) => { cvs[id] = canvas; delete urls[id]; };
  return portraitURL;
})();

  function newGame() { start('1.1'); }
  function cont() { const s = loadGame(); if (!s) return; leave(); state = s; flow.start(s.scene); }
  function quit() {
    M.resume();

  }
  function orbit() {
    try { cam.shot({ shot: 'MID', on: 'brick_phone', angle: 'high', move: 'orbit', from: 0, to: 360, dur: 240 }); }
    catch (e) { try { cam.override('set', { name: 'title_orbit' }); } catch (e2) { /* no camera yet */ } }
  }

  M.init = () => {
    on('key', (code) => { // J-A-R-V-I-S on the title opens the scene select

    M.paused = false; clock.paused = false; clock.scale = 1;

    if (!profile.seenPrologue) { profile.seenPrologue = true; saveOptions(); }
    if (TEST.auto) { // autoplay never stops at the title: P runs into 1.1; anything else means we're done
      if (!TWO_TEST.done && TEST.stop !== 'P' && flow.sceneId === 'P') { state = newState(); flow.start('1.1'); }
      else TWO_TEST.done = true;

    }
    M.mode = 'wait'; onTitle = true; typed = ''; uiEl.classList.add('menuon');
    root.classList.add('off');
    await ui.fade(1, 0.4);
    try {
      if (world.setId !== 'office') await world.load('office', { env: 'dark' }); else world.env('dark');
      if (typeof AUDIO !== 'undefined') { AUDIO.ambience(world.set.ambience); AUDIO.setRoom(world.set.ambience.room); }   // (no Dublin rain left over on the title)
      for (const id of (world.actors instanceof Map ? [...world.actors.keys()] : Object.keys(world.actors || {}))) world.despawn(id);
      if (typeof player !== 'undefined') player.enabled = false;
      orbit(); orbitT = 0;
    } catch (e) { console.warn('TWO: title scene', e); }
    if (typeof music === 'function') music('title');
    titleEl.classList.remove('off', 'withmenu');
    M.mode = 'press';
    ui.fade(0, 1.2);
  };
  M.pause = () => { M.paused = true; clock.paused = true; pauseMenu(); };
  M.resume = () => { M.paused = false; clock.paused = false; M.mode = null; root.classList.add('off'); uiEl.classList.remove('menuon'); };
  M.update = () => {
    if (onTitle && (orbitT += CONFIG.step) > 240) { orbitT = 0; orbit(); }
    if (M.mode === null) {
      if (input.pressed('pause') && typeof flow !== 'undefined' && flow.sceneId) { input.consume('pause'); M.pause(); }
      return;
    }
    if (M.mode === 'press') {
      if (input.pressed('yes')) { input.consume('yes'); ui.sfx('chime_ready'); titleEl.classList.add('withmenu'); mainMenu(); }
      return;

    if (M.mode !== 'menu') return;
    const n = items.length;

    if (input.pressed('down')) { sel = (sel + 1) % n; paint(); }
    const it = items[sel];
    if (it && it.adj && (input.pressed('left') || input.pressed('right'))) { it.adj(input.pressed('left') ? -1 : 1); paint(); }
    if (input.pressed('yes')) act();
    else if ((input.pressed('no') || (M.paused && input.pressed('pause'))) && back) back();
    for (let i = 0; i < M.keys.length; i++) input.consume(M.keys[i]);
  };
  M.keys = ['yes', 'no', 'up', 'down', 'left', 'right', 'pause', 'inventory', 'swap'];
  return M;
})();

  let seed = 1;

  const hm = (t) => { const m = /(\d{1,2}):(\d{2})/.exec(String(t || '12:00')); return m ? [+m[1], +m[2]] : [12, 0]; };
  const tilt = (cx, w, h, a) => { cx.translate(w / 2, h / 2); cx.rotate(a); cx.translate(-w / 2, -h / 2); };
  function wrap(cx, text, maxW) {
    const out = [];
    for (const para of String(text).split('\n')) {
      let line = '';
      for (const word of para.split(' ')) {
        const t = line ? line + ' ' + word : word;
        if (line && cx.measureText(t).width > maxW) { out.push(line); line = word; } else line = t;
      }
      out.push(line);

  }
  function fit(cx, text, font, maxW, maxH, size, lh = 1.2) { // biggest size <= size that wraps into the box

    cx.lineJoin = 'round'; cx.lineWidth = size * (o.felt ? 0.07 : 0.025); cx.textAlign = 'left'; cx.textBaseline = 'alphabetic';

    for (const ch of String(text)) {

    }
    cx.restore();
    return w;
  }
  function hands(cx, x, y, r, hh, mm, sec, col) {

    player.enabled = false; ui.prompt(null); hotspots.reset();
    if (lb) ui.letterbox(true);
    await runSteps(steps);
    if (g !== G) return;
    cutDepth--;
    if (cutDepth) return;
    if (cardOn) { ui.card(null); cardOn = false; }
    if (!o.keep) { // the last shot eases into the gameplay camera as the bars slide away
      if (lb) ui.letterbox(false);
      if (cam.cutscene) await cam.release(flow.skipping ? 0 : 0.8);
      if (g !== G) return;
    }
    if (!cutDepth) { flow.skipping = false; clock.scale = 1; }
    if (flow.roaming && !flow.busy) player.enabled = true;
  }

  function step(s) {
    const sk = flow.skipping;
    if ('shot' in s) {
      if (sk) return;
      cam.shot(s);
      if (s.card) { ui.card(s.card[0], s.card[1]); cardOn = true; } else if (cardOn) { ui.card(null); cardOn = false; }
      return;
    }
    if ('say' in s) {
      if (sk) return;
      const a = world.actor(s.say); // optional cues on a line: {say, text, expr: 'worried', act: 'lanyard'}
      if (a && s.expr) a.setExpr(s.expr);
      if (a && typeof s.act === 'string') a.play(s.act);
      return say(s.say, s.text, s);
    }
    if ('choice' in s) return choose(s.choice, s).then((i) => { flow.result = i; if (s.flag) setFlag(s.flag, i); });
    if ('ask' in s) return ask(s.ask, s).then((v) => { flow.result = v; if (s.flag) setFlag(s.flag, v); return runSteps(v ? s.yes : s.no); });
    if ('popup' in s) {
      if (s.clear) popup.clear();
      if (!s.popup || sk) return;
      const p = popup(s.popup);
      if (s.wait) return p.done.then((i) => { flow.result = i; });
      return;
    }
    if (typeof s.spawn === 'string') { world.spawn(s.spawn, s.at, s); return; } // {spawn, at, look?, set?} (set = spawn into that live set, e.g. a split's right half)
    if ('set' in s) return changeSet(s.set, s.env, s.spawn);
    if ('hold' in s) { const a = actorOf(s.hold); if (a) a.hold(s.prop ?? null, s.hand); return; }
    if ('music' in s) { mus(s.music, sk ? { cut: true } : s); return; }
    if ('par' in s) return Promise.all(s.par.map((x) => runSteps([x])));
    if ('if' in s) return runSteps(s.if(state) ? s.then : s.else);
    if ('do' in s) return s.do(ctx());
    if ('stare' in s) return stare(s);
    if ('move' in s) return move(s);
    if ('face' in s) { const a = actorOf(s.face); if (a) a.face(s.to, sk ? 0 : s.dur); return; }
    if ('expr' in s) { for (const [id, e] of s.expr) { const a = actorOf(id); if (a) a.setExpr(e); } return; }
    if ('act' in s) { for (const [id, anim, o] of s.act) { const a = actorOf(id); if (a) a.play(anim, o || {}); } return; }
    if ('despawn' in s) { world.despawn(s.despawn); return; }
    if ('place' in s) { const a = actorOf(s.place); if (a) a.place(s.at); return; }
    if ('prop' in s) {
      const o = world.prop(s.prop);
      if (!o) { console.warn('TWO: no prop ' + s.prop); return; }
      if ('visible' in s) o.visible = s.visible;
      if (s.pos) o.position.set(s.pos[0], s.pos[1], s.pos[2]);
      if ('rotY' in s) o.rotation.y = s.rotY;
      if (s.fn) s.fn(o);
      return;
    }
    if ('sfx' in s) { if (!sk) ui.sfx(s.sfx, s); return; }
    if ('loop' in s) {
      const l = loops[s.loop] || (loops[s.loop] = []), A = audio();
      if (s.stop) { for (const h of l) h.stop(s.fade ?? 0.5); l.length = 0; } else if (A) l.push(A.loop(s.loop, s));
      return;
    }
    if ('wait' in s) return wait(s.wait);
    if ('flash' in s) return ui.flash(s.flash, s.color);
    if ('fade' in s) return ui.fade(s.fade, s.dur ?? 0.5, s.color);
    if ('letterbox' in s) { ui.letterbox(s.letterbox); return; }
    if ('hud' in s) { if (!s.hud) hud.set(null); else if (s.anim) hud.animate(s.hud, s.anim); else hud.set(s.hud); return; }
    if ('flag' in s) { setFlag(s.flag, 'value' in s ? s.value : true); return; }
    if ('item' in s) {
      if (s.remove) inventory.remove(s.item);
      else if (!inventory.has(s.item)) { inventory.add(s.item); ui.toast('New item: ' + itemName(s.item)); }
      return;
    }
    if ('name' in s) { learnName(s.name); return; }
    if ('sample' in s) { learnSample(s.sample); return; }
    if ('objective' in s) { if (Array.isArray(s.objective)) objective.list(s.objective); else objective(s.objective); return; }
    if ('env' in s) { world.env(s.env, sk ? 0 : s.dur || 0); return; }
    if ('split' in s) { world.split(s.split, s); return; } // world builds/shows both sets itself
    if ('timelapse' in s) return timelapse(s.timelapse);
    if ('title' in s) return ui.title(s.title, s.dur);
    if ('actCard' in s) return ui.actCard(s.actCard);
    console.warn('TWO: unknown step', s);
  }

  function move(s) {
    const a = actorOf(s.move);
    if (!a) return;
    const p = a.moveTo(s.to, s); // world jumps straight there while flow.skipping
    if (s.nowait || flow.skipping) return;
    let done = false;
    p.then(() => { done = true; });
    return waitUntil(() => done).then(() => { if (!done) a.moveTo(s.to, s); }); // skipped mid-walk: jump there
  }

  // The stare: camera locked, music silent, no UI; the world and its ambient sounds carry on.
  function stare(s) {
    if (flow.skipping) return;
    const len = Math.min(4, s.stare || 3), amb = (s.ambient || []).slice().sort((a, b) => a[1] - b[1]), t0 = clock.t;
    let k = 0;
    cam.lock(true); silence(true); ui.prompt(null); hudEl.style.visibility = 'hidden';
    return waitUntil(() => {
      const t = clock.t - t0;
      for (; k < amb.length && amb[k][1] <= t; k++) ui.sfx(amb[k][0]);
      if (t >= len) return true;
      if (t >= 1 && input.pressed('yes')) { input.consume('yes'); return true; }
      return false;
    }).then(() => { cam.lock(false); silence(false); hudEl.style.visibility = ''; });
  }

  function timelapse(tl) {
    const keys = tl.keys || [], fired = keys.map(() => false);
    const fire = (i) => { if (fired[i]) return; fired[i] = true; return runSteps(keys[i].steps); };
    const rest = async () => { for (let i = 0; i < keys.length; i++) await fire(i); }; // keys a skip jumped over still apply
    if (flow.skipping) return rest();
    let done = false;
    world.timelapse(Object.assign({}, tl, { keys: keys.map((k, i) => ({ t: k.t, do() { fire(i); } })) })).then(() => { done = true; });
    return waitUntil(() => done).then(rest);
  }

  // ---------------------------------------------------------- busy runs (hotspot actions, inventory, hints)
  async function busyRun(fn) {
    const g = G;
    flow.busy = true; player.enabled = false; ui.prompt(null); hotspots.reset();
    try { await fn(); } catch (e) { console.error('TWO: action failed', e); }
    if (g !== G) return;
    flow.busy = false;
    if (flow.roaming) player.enabled = true;
  }

  // ---------------------------------------------------------- hotspots
  const hotspots = (() => {
    const list = [], used = new Set();
    let near = null, nearSel = null, holdH = null, holdT = 0, holdOn = false, hx = 0, hz = 0;
    const canRecord = (h) => !!h.sample && inventory.has('recorder') && !state.samples.includes(h.sample);
    const acts = (h) => !!(h.text != null || h.steps || h.ask || h.use || h.kettle || h.door || h.do);
    function live(h) {
      if (used.has(h) || (h.once && h.flag && state.flags[h.flag])) return false;
      if (h.only && h.only !== state.active) return false;
      if (h.when && !h.when(state)) return false;
      return acts(h) || canRecord(h);
    }
    function where(h) { // -> hx, hz; false when the spot isn't in this set
      const at = h.at ?? h.id;
      if (Array.isArray(at)) { hx = at[0]; hz = at[2]; return true; }
      const a = world.actor(at);
      if (a) { hx = a.pos.x; hz = a.pos.z; return a !== player.actor; }
      if (h._set !== world.setId) { // anchors/marks don't move: resolve once per set
        h._set = world.setId;
        const an = world.anchor(at), p = an ? an.at : world.mark(at);
        h._x = p ? p.x ?? p[0] : NaN; h._z = p ? p.z ?? p[2] : NaN;
      }
      hx = h._x; hz = h._z;
      return hx === hx;
    }
    function label(h) {
      const sel = inventory.selected;
      if (sel) return 'YES — Use ' + itemName(sel);
      const v = h.verb || 'Examine', base = v === 'YES' || v === 'NO' ? v : 'YES — ' + v;
      if (!canRecord(h)) return base;
      return acts(h) ? base + ' · hold to record' : 'YES — Hold to record';
    }
    function update(dt) {
      const me = player.actor;
      if (!me) return;
      if (holdH) { // hold YES for 1 s with the recorder; a tap does the spot's normal action
        const h = holdH;
        if (input.held('yes')) {
          holdT += dt;
          if (holdT >= 0.2 && !holdOn) { holdOn = true; ui.prompt('YES — Recording…'); ui.sfx('dictaphone'); }
          if (holdT < 1) return;
          holdH = null; near = null; player.enabled = true;
          ui.sfx((SAMPLES[h.sample] && SAMPLES[h.sample].sfx) || 'beep');
          learnSample(h.sample);
          return;
        }
        holdH = null; near = null; player.enabled = true;
        if (acts(h)) busyRun(() => fire(h));
        return;
      }
      let best = null, bd = 1e9;
      for (let i = 0; i < list.length; i++) {
        const h = list[i];
        if (!live(h) || !where(h)) continue;
        const dx = hx - me.pos.x, dz = hz - me.pos.z, d = dx * dx + dz * dz, r = h.r || 1.2;
        if (d <= r * r && d < bd) { bd = d; best = h; }
      }
      if (best !== near || inventory.selected !== nearSel) { near = best; nearSel = inventory.selected; ui.prompt(best ? label(best) : null); }
      if (inventory.selected && input.pressed('no')) { input.consume('no'); inventory.selected = null; return; }   // NO puts the item away, near a spot or not
      if (!best) return;
      const key = best.verb === 'NO' && !inventory.selected ? 'no' : 'yes';
      if (!input.pressed(key)) return;
      input.consume(key);
      if (canRecord(best) && !inventory.selected) { holdH = best; holdT = 0; holdOn = false; player.enabled = false; return; }
      busyRun(() => fire(best));
    }
    function speak(h) {
      let t = h.text, who = h.by || state.active;
      if (Array.isArray(t)) { h._n = ((h._n ?? -1) + 1) % t.length; t = t[h._n]; }
      if (t && typeof t === 'object') { const k = state.active in t ? state.active : Object.keys(t)[0]; if (!h.by) who = k; t = t[k]; }
      return say(who, t);
    }
    async function kettle(h) {
      if (!(await ask('Put the kettle on?'))) return false;
      if (player.actor && where(h)) player.actor.face([hx, hz]);
      ui.sfx('kettle'); // boils, clicks off, steam rises
      const at = h.at ?? h.id, steam = { n: 16, speed: 0.25, life: 1.8, color: 0xf2f2f2 };
      await wait(1.8); world.puff(at, steam);
      await wait(1.4); world.puff(at, steam);
      return true;
    }
    function placeParty(mark) { // spawn (not place) so actors also move across into a new set
      const f = flow.follow, m = typeof mark === 'string' ? world.mark(mark) : mark;
      world.spawn(state.active, mark);
      if (f && m) { const r = m[3] || 0; world.spawn(f, [m[0] - Math.sin(r) * 0.8, m[1], m[2] - Math.cos(r) * 0.8, r]); }
      recontrol();
    }
    async function door(h) {
      const d = h.door, kind = d.kind || 'jarvis', to = d.to && typeof d.to === 'object' && !Array.isArray(d.to) ? d.to : { mark: d.to };
      if (kind === 'jarvis') { // "takes nine seconds": ~2 s of spinner, then a jump cut
        const p = popup({ msg: 'JARVIS is loading this door.', spinner: true, buttons: [], icon: 'info' });
        const key = 'door_seen_' + h.id, first = d.first && !state.flags[key];
        if (first) state.flags[key] = true;
        await Promise.all([wait(2), first ? playCutscene(d.first, { letterbox: false }) : null]);
        p.close();
      } else if (kind === 'wood') { ui.sfx('creak'); await ui.fade(1, 0.35); }
      else ui.sfx('door_slide');
      if (to.set && to.set !== world.setId) { if (kind !== 'wood') await ui.fade(1, 0.25); await loadSet(to.set, to.env); }
      placeParty(to.mark);
      if (kind === 'wood' || to.set) ui.fade(0, 0.35);
    }
    async function fire(h) {
      const sel = inventory.selected;
      let done = true, boiled = false;
      inventory.selected = null;
      testLog('hotspot ' + h.id + (sel ? ' use ' + sel : ''));
      if (sel) {
        const u = h.use && h.use[sel];
        if (!u) { await say(state.active, "That won't work."); return; }
        await runAny(u);
      } else {
        if (h.text != null) await speak(h);
        if (h.kettle) { if (!(await kettle(h))) return; boiled = true; }
        if (h.ask) {
          const y = await ask(h.ask.q, h.ask), b = y ? h.ask.yes : h.ask.no;
          if (b) await runAny(b);
          if (!y) return;
        }
        if (h.steps) await playCutscene(h.steps, { letterbox: false });
        if (h.door) await door(h);
        if (h.do) await h.do(ctx());
        done = !h.use; // a spot with `use` only completes through the right item
      }
      if (done && h.flag) setFlag(h.flag, true);
      if (done && h.once) used.add(h);
      if (boiled && saveGame()) ui.toast('Saved.');   // (storage blocked: no false "Saved.")
    }
    return {
      list, used, update,
      reset() { near = null; holdH = null; },
      trigger(x) { // run a spot by id (autoplay helpers, content)
        const h = typeof x === 'string' ? list.find((e) => e.id === x) : x;
        if (!h) { console.warn('TWO: no hotspot ' + x); return Promise.resolve(); }
        return busyRun(() => fire(h));
      },
    };
  })();

  // ---------------------------------------------------------- inventory
  const inventory = {
    selected: null,
    has: (id) => state.inventory.includes(id),
    add(id) { if (state.inventory.includes(id)) return; state.inventory.push(id); emit('item:add', id); },
    remove(id) {
      const i = state.inventory.indexOf(id);
      if (i >= 0) state.inventory.splice(i, 1);
      if (inventory.selected === id) inventory.selected = null;
    },
    open() {
      if (panelOpen) return;
      const free = (flow.roaming || mg) && !flow.busy && !cutDepth; // actions only in play, never mid-cutscene
      panelOpen = true;
      const pe = player.enabled;
      player.enabled = false; ui.prompt(null); hotspots.reset();
      const close = () => { panelOpen = false; player.enabled = pe; };
      const act = (fn) => { close(); if (free) busyRun(fn); };
      ui.inventoryPanel({
        items: state.inventory.map((id) => ({ id, name: itemName(id), icon: ITEMS[id] && ITEMS[id].icon })),
        onExamine: (id) => act(async () => {
          const it = ITEMS[id] || {};
          if (it.examine) await runAny(it.examine); else await say(state.active, it.desc || itemName(id));
          if (it.flip && (await ask(it.flip.q || 'Flip it?', it.flip))) await runAny(it.flip.steps);
        }),
        onUse: (id) => { close(); if (free) { inventory.selected = id; ui.toast('Using: ' + itemName(id)); } },
        onCombine: (a, b) => act(() => {
          const c = (ITEMS[a] && ITEMS[a].combine && ITEMS[a].combine[b]) || (ITEMS[b] && ITEMS[b].combine && ITEMS[b].combine[a]);
          return c ? runAny(c) : say(state.active, "That won't work.");
        }),
        onClose: close,
      });
    },
  };

  // ---------------------------------------------------------- minigame host
  function clearOverlay() {
    const c = ovEl.getContext('2d'), d = devicePixelRatio || 1;
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, ovEl.width, ovEl.height); c.setTransform(d, 0, 0, d, 0, 0);
  }
  function minigame(id, params) {
    const m = MINIGAMES[id];
    if (!m) { console.warn('TWO: minigame ' + id + ' is not built'); return Promise.resolve({ missing: true }); }
    testLog('minigame ' + id);
    clearOverlay(); ovEl.classList.remove('off'); mgEl.textContent = '';
    return new Promise((res) => {
      const me = { m, paused: 0, api: null };
      const api = me.api = {
        finish(r) {
          if (mg !== me) return;
          mg = null;
          try { if (m.end) m.end(r); } catch (e) { console.error('TWO: minigame ' + id + ' end()', e); }
          clearOverlay(); ovEl.classList.add('off'); mgEl.textContent = '';   // hidden between minigames (start shows it)
          flow.result = r; res(r);
        },
        overlay: { canvas: ovEl, ctx: ovEl.getContext('2d'), get w() { return innerWidth; }, get h() { return innerHeight; },
          show(b) { ovEl.classList.toggle('off', !b); } },
        ui: mgEl, world, cam, input, sfx: typeof sfx === 'function' ? sfx : sfxFn, AUDIO: audio(), say, ask, choose, popup, hud,
        async play(steps) { me.paused++; try { await runSteps(steps); } finally { me.paused--; } },
        params: params || {}, state,
      };
      mg = me;
      try {
        m.start(api.params, api);
        if (TEST.auto) {
          if (m.autoplay) Promise.resolve(m.autoplay(api)).catch((e) => { console.error('TWO: minigame ' + id + ' autoplay()', e); api.finish({ error: true }); });
          else wait(0.5).then(() => api.finish({ auto: true }));
        }
      } catch (e) { console.error('TWO: minigame ' + id + ' start()', e); api.finish({ error: true }); }
    });
  }

  // ---------------------------------------------------------- per tick / per frame
  function tick(dt) {
    clock.scale = cutDepth && input.held('no') ? 3 : 1; // hold NO to fast-forward a cutscene
    if (mg && !mg.paused && !panelOpen && mg.m.update) {
      try { mg.m.update(dt); } catch (e) { console.error('TWO: minigame update()', e); mg.api.finish({ error: true }); }
    }
    if (!flow.roaming || flow.busy || panelOpen || cutDepth) return;
    if (input.pressed('inventory')) { input.consume('inventory'); inventory.open(); return; }
    if (flow.swap && input.pressed('swap')) { input.consume('swap'); doSwap(); }
    hotspots.update(dt);
  }
  function draw() {
    if (!mg || !mg.m.draw) return;
    try { mg.m.draw(); } catch (e) { console.error('TWO: minigame draw()', e); mg.api.finish({ error: true }); }
  }

  // ---------------------------------------------------------- roam
  async function roam(o) {
    const g = G, u = o.until;
    const solved = () => {
      if (typeof u === 'function') return !!u(state);
      if (Array.isArray(u)) { for (let i = 0; i < u.length; i++) if (!state.flags[u[i]]) return false; return true; }
      return u ? !!state.flags[u] : false;
    };
    if (TEST.auto) {
      if (o.auto) await o.auto(ctx());
      else if (typeof u !== 'function') for (const f of [].concat(u || [])) setFlag(f, true);
      if (u && !solved()) console.warn('TWO: roam auto() left `until` unsolved in ' + flow.sceneId);
      return;
    }
    if (cam.cutscene) cam.release(); // e.g. a minigame's shot straight into play: ease back to the gameplay camera
    flow.roaming = true; player.enabled = true; hotspots.reset(); showSwap();
    const t0 = clock.t;
    let hinted = !o.hint;
    await waitUntil(() => {
      if (g !== G) return true;
      if (flow.busy || panelOpen || cutDepth) return false;
      if (solved()) return true;
      if (!hinted && clock.t - t0 >= (o.hint.after ?? 120)) { hinted = true; busyRun(() => playCutscene(o.hint.steps, { letterbox: false })); }
      return false;
    });
    if (g !== G) return;
    flow.roaming = false; player.enabled = false; inventory.selected = null;
    ui.prompt(null); hotspots.reset(); ui.swapIndicator(null);
  }

  // ---------------------------------------------------------- scenes
  function sceneStep(st, nx) {
    const a = st[1], o = st[2] || {};
    switch (st[0]) {
      case 'cutscene': {
        const lb = o.letterbox !== false; // keep the bars and the shot when another cutscene or the scene's end follows
        return playCutscene(a, { letterbox: lb, keep: lb && (!nx || (nx[0] === 'cutscene' && !(nx[2] && nx[2].letterbox === false))) });
      }
      case 'steps': return playCutscene(a, { letterbox: false });
      case 'objective': if (Array.isArray(a)) objective.list(a); else objective(a); return;
      case 'control': state.active = a; if (actorOf(a)) player.control(a); showSwap(); return;
      case 'roam': return roam(a || {});
      case 'minigame': player.enabled = false; return minigame(a, st[2]);
      case 'wait': return wait(a);
      case 'set': return (async () => { const g = G; await ui.fade(1, 0.4); if (g !== G) return; await changeSet(a, o.env, o.spawn); ui.fade(0, 0.5); })();
      case 'cam': cam.override(a, st[2]); return;
      case 'swap':
        flow.swap = !!a; showSwap();
        if (a) ui.toast(input.scheme === 'pad' ? 'Y — Swap' : input.scheme === 'touch' ? 'SWAP — Swap' : 'TAB — Swap');
        return;
      case 'follow': flow.follow = a || null; player.follower(flow.follow); return;
      case 'do': return a(ctx());
      case 'save': saveGame(); return;
    }
    console.warn('TWO: unknown scene step ' + st[0]);
  }

  function stop() {
    G++;
    if (mg) mg.api.finish({ aborted: true });
    flow.skipping = false; flow.roaming = false; flow.busy = false; flow.sceneId = null;
    panelOpen = false; cutDepth = 0; clock.scale = 1; inventory.selected = null;
    for (const n in loops) { for (const h of loops[n]) h.stop(0.4); loops[n].length = 0; }
    player.enabled = false;
    ui.inventoryPanel(null); ui.prompt(null); ui.swapIndicator(null); hotspots.reset();
    hudEl.style.visibility = ''; silence(false); cam.lock(false);
  }
  function toTitle() { stop(); menus.title(); }
  function theEnd() { testLog('end of built content'); if (TEST.auto) TWO_TEST.done = true; else toTitle(); }

  function next() {
    const nx = SCENE_ORDER[SCENE_ORDER.indexOf(flow.sceneId) + 1];
    if (nx && SCENES[nx]) return start(nx);
    theEnd();
  }

  async function start(id, o = {}) {
    if (!inited) { inited = true; addUpdate(tick); on('render', draw); }
    stop();
    const g = G, sc = SCENES[id];
    flow.sceneId = id; flow.scene = sc || null; flow.stepIndex = 0; flow.result = null;
    TWO_TEST.scene = id; TWO_TEST.step = null;
    testLog('scene ' + id);
    if (!sc) { console.warn('TWO: scene ' + id + ' is not built'); return theEnd(); }
    try {
      if (o.select) { // scene select: a fresh state plus everything earlier scenes guarantee
        state = newState();
        for (const x of SCENE_ORDER) { if (x === id) break; if (SCENES[x] && SCENES[x].grants) grant(SCENES[x].grants); }
      }
      state.scene = id;
      await ui.fade(1, 0.5);
      if (g !== G) return;
      popup.clear(); ui.card(null); cardOn = false; objective(null); ui.letterbox(false);
      if (cam.cutscene) cam.release(0);
      cam.override(null); world.split(null);
      despawnAll();
      if (sc.set) await loadSet(sc.set, sc.env);
      if (g !== G) return;
      if (sc.spawn) spawnMap(sc.spawn);
      const pl = sc.playable || [];
      if (pl.length && !pl.includes(state.active)) state.active = pl[0];
      flow.swap = !!sc.swap; flow.follow = null; player.follower(null);
      recontrol();
      hud.set('hud' in sc ? sc.hud : { battery: state.battery, bars: state.bars });
      if ('music' in sc) mus(sc.music);
      hotspots.list.length = 0; hotspots.used.clear();
      if (sc.hotspots) hotspots.list.push(...sc.hotspots);
      if (id !== 'P') saveGame(); // Continue resumes at the start of this scene
      if (ACTS[id]) await ui.actCard(ACTS[id]);
      // No scene-title card: several titles are the scene's own punchline ("Not Yet", "It's Genius").
      // Titles live in scene select; date/time cards are authored in the scenes where the script asks.
      if (g !== G) return;
      ui.fade(0, 0.8); // the first step runs in this same tick, so an opening shot (or {fade}) wins
      const steps = sc.steps || [];
      for (let i = 0; i < steps.length; i++) {
        if (g !== G) return;
        const st = steps[i];
        flow.stepIndex = i; TWO_TEST.step = i + ' ' + st[0];
        testLog('scene ' + id + ' step ' + i + ' ' + st[0] + (typeof st[1] === 'string' ? ' ' + st[1] : ''));
        try { await sceneStep(st, steps[i + 1]); } catch (e) { console.error('TWO: scene ' + id + ' step ' + i + ' (' + st[0] + ') failed', e); }
      }
      if (g !== G) return;
    } catch (e) { console.error('TWO: scene ' + id + ' failed', e); return; }
    emit('scene:end', { id });
    testLog('scene ' + id + ' end');
    if (TEST.auto && (id === TEST.stop || id === 'PC')) { TWO_TEST.done = true; return; }
    if (id === 'PC') { profile.completed = true; saveOptions(); return toTitle(); }
    if (id === 'P' && !TEST.auto) return toTitle();
    next();
  }

  const flow = {
    skipping: false, scene: null, sceneId: null, stepIndex: 0, result: null,
    swap: false, follow: null, roaming: false, busy: false,
    get cutscene() { return cutDepth > 0; }, // a cutscene (or a spot's steps) is running: the pause menu offers Skip Scene
    start, next, stop, minigame,
    skip() { // pause menu: run the rest of this cutscene instantly (state steps still apply)
      if (!cutDepth) return;
      flow.skipping = true; popup.clear();
      if (cardOn) { ui.card(null); cardOn = false; }
    },
  };

  return { flow, hotspots, inventory, runSteps, playCutscene };
})();
// ============================================================ MAIN
// boot(): loader (everything built, compiled and uploaded up front) -> "JARVIS is ready." -> prologue on first launch -> title.
// The loop: fixed 60 Hz ticks (input, menus, UI, updaters, world.update) + interpolated world.render every frame.

async function boot() {
  try {
    const s = JSON.parse(localStorage.getItem('two.save'));
    if (s && s.options) Object.assign(options, s.options);
    if (s && s.profile) Object.assign(profile, s.profile);
  } catch (e) { /* storage blocked: defaults */ }
  document.body.classList.toggle('large', options.textSize === 'large');
  ui.init(); menus.init();
  on('scene:end', (e) => {
    const id = e && typeof e === 'object' ? e.id : e;
    if (TEST.auto && (id === TEST.stop || id === 'PC')) TWO_TEST.done = true;
  });
  const hasWorld = () => typeof world !== 'undefined' && world.set;

  // ---------------------------------------------------------- loop
  const step = CONFIG.step;
  let last = performance.now(), acc = 0;
  function tick() {
    input.tick();
    menus.update();
    if (clock.paused) return;
    ui.update(step);
    clock.step();
    if (hasWorld()) world.update(step);
  }
  function frame(now) {
    requestAnimationFrame(frame);
    const ms = now - last;
    last = now;
    perf.frame(ms);
    input.poll();
    acc += Math.min(ms / 1000, CONFIG.maxFrame) * (TEST.auto ? Math.max(clock.scale, TEST.speed) : clock.scale);
    for (let n = 0; acc >= step && n < 12; n++) { tick(); acc -= step; }
    if (acc >= step) acc %= step; // more than 12 ticks behind: drop it rather than spiral
    renderer.info.reset();
    if (hasWorld()) world.render(acc / step);
    emit('render', acc / step);
    perf.draw();
    if (renderer.info.programs.length > progN) {   // every shader should have been compiled by the loader
      progN = renderer.info.programs.length;
      if (TEST.auto) console.warn('TWO: shader compiled mid-game in ' + flow.sceneId + ' step ' + flow.stepIndex + ' (' + cam.name + ')');
    }
  }
  let progN = Infinity;
  requestAnimationFrame(frame);

  // ---------------------------------------------------------- loader
  const ld = document.getElementById('loader'), bar = ld.querySelector('.jv-prog i'), pct = ld.querySelector('.jv-prog span');
  const setP = (f) => { bar.style.transform = `scaleX(${f})`; pct.textContent = Math.round(f * 100) + '%'; };
  const nextFrame = () => new Promise((r) => requestAnimationFrame(() => r()));
  setP(0);

  // Build one character under the fixed light rig (hemi + dir + spot + FogExp2, same program family as the sets),
  // compile + upload it, and bake its dialogue portrait from a head-and-shoulders render of the real model.
  let warm = null;
  const warmCharacter = (id) => {
    if (!warm) {
      const sc = new THREE.Scene();
      sc.background = new THREE.Color(0x2c3868);
      sc.fog = new THREE.FogExp2(0x2c3868, 0.002);
      sc.add(new THREE.HemisphereLight(0xfff2e0, 0x404058, 1.4));
      const dl = new THREE.DirectionalLight(0xffffff, 1.7); dl.position.set(1.2, 2.5, 3); sc.add(dl);
      const sp = new THREE.SpotLight(0xffffff, 0); sc.add(sp, sp.target);
      // program families only mid-game meshes use (Rue's walk-2 smears: transparent, instanced + colours): compile them now
      const px = canvasTex(4, 4, () => {}, { key: 'warm_px' });
      for (const tr of [false, true]) for (const map of [null, px]) for (const col of [false, true]) {
        const im = new THREE.InstancedMesh(new THREE.BoxGeometry(0.001, 0.001, 0.001), mat(0xffffff, { transparent: tr, map, key: 'warm_family' }), 1);
        if (col) im.setColorAt(0, sc.background);
        im.frustumCulled = false; sc.add(im);
      }
      warm = { sc, cam: new THREE.PerspectiveCamera(30, 1, 0.05, 30), v: new THREE.Vector3() };
    }
    const rig = buildCharacter(id), v = warm.v, c = warm.cam, gl = renderer.domElement;
    warm.sc.add(rig.root);
    if (rig.face && rig.face.set) rig.face.set('neutral');
    rig.root.updateMatrixWorld(true);
    if (typeof rig.eye === 'number') v.set(0, rig.eye - 0.04, 0); else { rig.parts.head.getWorldPosition(v); v.y += 0.08; }
    c.aspect = gl.width / gl.height; c.updateProjectionMatrix();
    c.position.set(v.x + 0.12, v.y + 0.05, v.z + 0.8); c.lookAt(v.x, v.y + 0.01, v.z);
    renderer.compile(warm.sc, c);
    renderer.render(warm.sc, c);
    const pc = document.createElement('canvas'), side = Math.min(gl.width, gl.height);
    pc.width = pc.height = 128;
    pc.getContext('2d').drawImage(gl, (gl.width - side) / 2, (gl.height - side) / 2, side, side, 0, 0, 128, 128); // same task as the render
    portraitURL.bake(id, pc);
    warm.sc.remove(rig.root);
    if (typeof world !== 'undefined' && world.adopt) world.adopt(id, rig);   // its first spawn reuses it: no build, no upload mid-game
  };
  const jobs = [];
  if (typeof AUDIO !== 'undefined') jobs.push(() => AUDIO.prerender());
  if (typeof world !== 'undefined') for (const id in SETS) jobs.push(() => world.warm(id));
  if (typeof buildCharacter === 'function') for (const id in LOOKS) if (LOOKS[id]) jobs.push(() => warmCharacter(id));
  await nextFrame();
  for (let i = 0; i < jobs.length; i++) {
    try { await jobs[i](); } catch (e) { console.error('TWO boot job failed', e); }
    setP((i + 1) / jobs.length);
    await nextFrame();
  }
  renderer.setRenderTarget(null); renderer.clear();
  perf.adapt = true;
  progN = renderer.info.programs.length;

  if (TEST.auto) {
    ld.classList.add('off');
    if (typeof AUDIO !== 'undefined') AUDIO.init();
    state = newState();
    TWO_TEST.ready = true;
    flow.start(TEST.scene || 'P', { select: !!TEST.scene });
    return;
  }

  // "JARVIS is ready. [YES]" — the first key/click unlocks audio inside the event itself
  ld.querySelector('.jv-msg').textContent = 'JARVIS is ready.';
  ld.querySelector('.jv-prog').classList.add('off');
  const yes = document.createElement('button');
  yes.className = 'jv-b foc'; yes.textContent = 'YES';
  ld.querySelector('.jv-btns').append(yes);
  input.gesture = () => { if (typeof AUDIO !== 'undefined') AUDIO.init(); };
  TWO_TEST.ready = true;
  await new Promise((res) => {
    const f = () => { if (input.pressed('yes')) { input.consume('yes'); done(); } };
    const done = () => { removeUpdate(f); yes.onclick = null; res(); };
    yes.onclick = done;
    addUpdate(f);
  });
  ui.sfx('chime_ready');
  ld.classList.add('off');
  if (!profile.seenPrologue) { state = newState(); flow.start('P'); } else menus.title();
}

boot();
